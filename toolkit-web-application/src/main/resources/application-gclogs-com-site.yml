# gclogs.com site: only the GC logs analyzer, which also owns the root page
spring:
  servlet:
    multipart:
      max-file-size: 33MB
      max-request-size: 33MB
  # Moved from the default configuration, so that the stylesheets are not cached during local development
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d

server:
  port: 28371
  tomcat:
    accesslog:
      directory: /home/pasqal/logs
      enabled: true
      file-date-format: .yyyy-MM-dd
      pattern: "%t [%h] [%{X-Forwarded-For}i] [%r] [%s] [%b bytes] [%D ms] [%{User-Agent}i] [%{Referer}i] [%I] [%S] [%{Content-Type}o]"
      prefix: access_log
      rename-on-rotate: false
      request-attributes-enabled: false
      rotate: true
      suffix: .log

safepoint.files.dir: /home/pasqal/analyzer-inputs/

parsing:
    results:
        expiration: 3m
        removeAfterRead: true
    workerThreads: 1

indexPageAvailable: true
