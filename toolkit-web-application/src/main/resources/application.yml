spring:
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: ${MAX_REQUEST_SIZE:20480MB}
      max-request-size: ${MAX_REQUEST_SIZE:20480MB}

server:
  port: ${SERVER_PORT:8079}
  tomcat:
    max-http-form-post-size: 20480MB
  compression:
    enabled: true
    mime-types: text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json, application/hal+json
    min-response-size: 1024

# GC logs analyzer
safepoint.files.dir: ${UPLOAD_DIR:/${java.io.tmpdir}}

parsing:
  results:
    expiration: ${REPORT_EXPIRATION:10m}
    removeAfterRead: ${REPORT_REMOVE_AFTER_READ:false}
  workerThreads: ${NUMBER_OF_WORKER_THREADS:4}

# Used only on the gclogs.com site (gclogs-com-site profile), where the GC logs analyzer owns the root page
indexPageAvailable: false
dockerImage: @docker.image.name@


