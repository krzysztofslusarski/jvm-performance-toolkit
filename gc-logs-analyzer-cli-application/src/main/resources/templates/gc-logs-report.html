<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${logFileName} + ' - GC Log Analyzer'">GC Log Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <link href="css/gc-logs.css" rel="stylesheet">
    <script src="js/theme.js"></script>
    <style>
        /* Every chart is an image drawn in both themes, only the one of the current theme is shown */
        .report-chart img {
            display: block;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .report-chart .chart-dark { display: none; }
        :root.dark .report-chart .chart-light { display: none; }
        :root.dark .report-chart .chart-dark { display: block; }

        .content-info {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }
        .report-content { margin-bottom: 1.5rem; }
        .report-content table.data-table td:not(:first-child),
        .report-content table.data-table th:not(:first-child) { text-align: right; }
    </style>
</head>
<body>
<div class="viewer-layout">
    <nav class="viewer-sidebar">
        <div class="sidebar-brand">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            GC Log Analyzer
        </div>
        <div class="sidebar-file-name">
            <div th:text="${logFileName}">gc.log</div>
            <div style="font-weight: 400; font-size: 0.75rem; color: var(--text-sidebar-heading);" th:text="'Parser: ' + ${parsingMode}">Parser</div>
        </div>
        <ul class="nav-list">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-page="all">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Show all
                </a>
            </li>
            <li class="nav-item" th:each="page, pageStatus : ${pages}">
                <a class="nav-link" href="#" th:data-page="${pageStatus.index}">
                    <svg th:if="${page.icon.name() == 'STATS'}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <svg th:if="${page.icon.name() == 'CHART'}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    <svg th:if="${page.icon.name() == 'HOME'}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span th:text="${page.menuName}">Page</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-section">
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
                <span data-theme-toggle-icon></span>
                <span>Toggle theme</span>
            </button>
        </div>
    </nav>

    <main class="viewer-content">
        <div class="subpage" th:each="page, pageStatus : ${pages}" th:data-page="${pageStatus.index}">
            <h2 th:text="${page.fullName}">Page</h2>
            <span th:if="${page.info != null}" th:text="${page.info}"></span>

            <div class="report-content" th:each="content : ${page.pageContents}">
                <h3 th:if="${content.title != null}" th:text="${content.title}">Title</h3>
                <span class="content-info" th:if="${content.info != null}" th:text="${content.info}"></span>

                <th:block th:if="${content.type.name() == 'CHART'}" th:with="image=${chartImages.get(content)}">
                    <figure class="report-chart" th:if="${image != null}">
                        <img class="chart-light" loading="lazy" th:src="${image} + '.png'" th:alt="${content.title}"/>
                        <img class="chart-dark" loading="lazy" th:src="${image} + ${darkSuffix} + '.png'" th:alt="${content.title}"/>
                    </figure>
                    <div class="alert alert-danger" th:if="${image == null}">The chart cannot be drawn.</div>
                </th:block>

                <div class="table-wrapper" th:if="${content.type.name() == 'TABLE'}">
                    <table class="data-table" th:style="'width: ' + ${content.screenWidth} + ';'">
                        <thead th:if="${content.header != null}" th:class="${content.table.size() >= 18 ? 'sticky-header' : ''}">
                        <tr>
                            <th th:each="column : ${content.header}" th:text="${column}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${content.table}">
                            <td th:each="column : ${row}" th:text="${column}"></td>
                        </tr>
                        </tbody>
                        <tfoot th:if="${content.footer != null}">
                        <tr>
                            <td th:each="column : ${content.footer}" th:text="${column}"></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="text/javascript">
    // "Show all" or a single page of the report
    document.querySelectorAll('.nav-link').forEach(function (link) {
        link.addEventListener('click', function (event) {
            event.preventDefault();
            var page = link.getAttribute('data-page');
            document.querySelectorAll('.subpage').forEach(function (subpage) {
                subpage.style.display = page === 'all' || subpage.getAttribute('data-page') === page ? '' : 'none';
            });
            document.querySelectorAll('.nav-link').forEach(function (other) {
                other.classList.toggle('active', other === link);
            });
            window.scrollTo(0, 0);
        });
    });
</script>
</body>
</html>
